---
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "05:00"
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: daily
      time: "05:00"
    commit-message:
      prefix: build
    labels:
      - dependencies
    groups:
      gems:
        patterns:
          - "*"
