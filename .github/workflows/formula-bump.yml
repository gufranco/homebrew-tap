---
name: formula-bump

on:
  repository_dispatch:
    types: [formula-bump]
  workflow_dispatch:
    inputs:
      name:
        description: The formula name to bump
        required: true
        type: string
      tag:
        description: The release tag to point it at
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: formula-bump-${{ github.event.client_payload.name || inputs.name }}
  cancel-in-progress: false

jobs:
  bump:
    name: build, test and publish the formula on main
    runs-on: macos-26
    timeout-minutes: 45
    env:
      NAME: ${{ github.event.client_payload.name || inputs.name }}
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
      - uses: Homebrew/actions/setup-homebrew@0fdc2c96a16d9f945f7e1577784302fd27a549a9
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f  # v1.335.0
        with:
          bundler-cache: true
      - name: Point the formula at the new tag
        run: bundle exec rake formula:bump
      - name: Build it from source and run its test block
        run: bundle exec rake formula:verify
      - name: Commit and push it to main
        run: bundle exec rake formula:publish
