---
name: formula-bump

on:
  repository_dispatch:
    types: [formula-bump]
  workflow_dispatch:
    inputs:
      name:
        description: The formula name to bump
        required: true
        type: string
      tag:
        description: The release tag to point it at
        required: true
        type: string
      asset:
        description: The source archive attached to the release, when the release attaches one
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: formula-bump-${{ github.event.client_payload.name || inputs.name }}
  cancel-in-progress: false

jobs:
  bump:
    name: build, test and publish the formula on main
    runs-on: macos-26
    timeout-minutes: 45
    env:
      NAME: ${{ github.event.client_payload.name || inputs.name }}
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
      ASSET: ${{ github.event.client_payload.asset || inputs.asset }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/create-github-app-token@v3.4.0
        id: app-token
        with:
          client-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
      - uses: Homebrew/actions/setup-homebrew@b4c226ae32acab42c7c2c0745ad224a1e9958022
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Unlink the runner's default openssl@3 so a dependency on openssl@4 links cleanly
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew unlink openssl@3
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f  # v1.345.0
        with:
          bundler-cache: true
      - name: Point the formula at the new tag
        run: bundle exec rake formula:bump
      - name: Build it from source and run its test block
        run: bundle exec rake formula:verify
      - name: Commit and push it to main
        run: bundle exec rake formula:publish
