name: formula-bump

on:
  repository_dispatch:
    types: [formula-bump]
  workflow_dispatch:
    inputs:
      name:
        description: The formula name to bump
        required: true
        type: string
      tag:
        description: The release tag to point it at
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: formula-bump-${{ github.event.client_payload.name || inputs.name }}
  cancel-in-progress: false

jobs:
  bump:
    name: point the formula at the new tag on main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app-token
        with:
          client-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Rewrite the formula for the new tag
        id: rewrite
        env:
          NAME: ${{ github.event.client_payload.name || inputs.name }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: |
          set -euo pipefail
          case "${NAME}" in
            anypatch | fdstoolkit | maeyomi | fusho | kakikomi | kiyome) ;;
            *) echo "unknown formula ${NAME}" >&2; exit 1 ;;
          esac
          bash scripts/update-formula.sh "${NAME}" "${TAG}"
          {
            echo "name=${NAME}"
            echo "tag=${TAG}"
          } >> "${GITHUB_OUTPUT}"

      - name: Commit the bump to main
        env:
          NAME: ${{ steps.rewrite.outputs.name }}
          TAG: ${{ steps.rewrite.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "gufranco-tap-bot[bot]"
          git config user.email "346559818+gufranco-tap-bot[bot]@users.noreply.github.com"
          git add "Formula/${NAME}.rb"
          if git diff --cached --quiet; then
            echo "Formula/${NAME}.rb already points at ${TAG}"
            exit 0
          fi
          git commit -m "chore(formula): point ${NAME} at ${TAG}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt ${attempt} lost a race, rebasing"
            git pull --rebase origin main
          done
          exit 1
