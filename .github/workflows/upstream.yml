---
name: upstream

on:
  push:
    branches: [main]
    paths:
      - Formula/**
      - Casks/**
  pull_request:
    branches: [main]
    paths:
      - Formula/**
      - Casks/**
  schedule:
    - cron: "23 5,13,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit every formula and cask online
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit
      - name: Remove the runner's azure-cli formula before it moves to a cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew uninstall --formula --ignore-dependencies --force azure-cli
      - uses: Homebrew/actions/setup-homebrew@b4c226ae32acab42c7c2c0745ad224a1e9958022
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f  # v1.345.0
        with:
          bundler-cache: true
      - name: Strict online audit of every download, checksum and homepage
        run: bundle exec rake audit
