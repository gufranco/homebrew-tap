name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tap-syntax:
    name: style and audit
    runs-on: macos-26
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Remove the runner's azure-cli formula before it moves to a cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          if brew list --formula azure-cli >/dev/null 2>&1; then
            brew uninstall --formula --ignore-dependencies azure-cli
          fi

      - uses: Homebrew/actions/setup-homebrew@0fdc2c96a16d9f945f7e1577784302fd27a549a9

      - name: Style and audit the tap
        run: brew test-bot --only-tap-syntax --tap="gufranco/tap"

  scripts:
    name: script tests and coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f  # v1.335.0
        with:
          bundler-cache: true

      - name: Install bats and shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats shellcheck

      - name: ShellCheck
        run: shellcheck scripts/*.sh test/*.bats

      - name: Tests with a 100% line coverage gate
        run: bash scripts/coverage.sh 100
